<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title description">
  <title id="title">Piyush Patni — AI Engineer</title>
  <desc id="description">A futuristic black and electric-blue banner with large AI Engineer typography and an abstract illuminated computational network. Applied ML, LLM systems, and data science.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#05080F"/><stop offset=".6" stop-color="#091321"/><stop offset="1" stop-color="#071122"/></linearGradient>
    <linearGradient id="ink" x2="1" y2=".2"><stop stop-color="#EDF7FF"/><stop offset=".55" stop-color="#93D7FF"/><stop offset="1" stop-color="#57A3FF"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#75E9FF"/><stop offset=".5" stop-color="#4076FF"/><stop offset="1" stop-color="#9065FF"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#176DF7" stop-opacity=".35"/><stop offset="1" stop-color="#176DF7" stop-opacity="0"/></radialGradient>
    <radialGradient id="core"><stop stop-color="#C4F7FF"/><stop offset=".18" stop-color="#48C9FF"/><stop offset=".42" stop-color="#285CDC"/><stop offset="1" stop-color="#0A1837"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#95BEEB" opacity=".13"/></pattern>
    <filter id="bloom" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
