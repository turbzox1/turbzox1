<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title description">
  <title id="title">Hey, I'm Piyush Patni. AI Engineer.</title>
  <desc id="description">A personal engineering notebook in blue ink on graph paper. A sketched workflow loops from idea to build to test to hmm, with the note: repeat until it makes sense.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#BCD0D9" stroke-width=".65"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#2F5070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1280" height="400" fill="#F7F4E9"/>
  <rect width="1280" height="400" fill="url(#paper)"/>
  <path d="M56 0V400" stroke="#C6766E" stroke-width="1.2" opacity=".65"/>
  <g fill="#DFE1D8"><circle cx="24" cy="75" r="8"/><circle cx="24" cy="200" r="8"/><circle cx="24" cy="325" r="8"/></g>
  <text x="94" y="84" font-family="'Segoe Print', 'Comic Sans MS', cursive" font-size="25" fill="#2F5070" transform="rotate(-3 94 84)">hey, I'm</text>
  <text x="89" y="182" font-family="Arial, Helvetica, sans-serif" font-size="87" font-weight="700" letter-spacing="-4" fill="#24374C">Piyush Patni</text>
  <path d="M96 204Q295 196 552 205M116 210Q350 207 492 211" stroke="#BE6549" stroke-width="3" stroke-linecap="round" fill="none"/>
  <g transform="rotate(-2 252 262)">
    <rect x="95" y="232" width="305" height="61" rx="3" fill="#2F5070"/>
    <text x="117" y="273" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="1" fill="#FAF8F0">AI ENGINEER</text>
  </g>
  <text x="95" y="345" font-family="Consolas, monospace" font-size="21" fill="#40546A">building things. checking the answers.</text>
  <g transform="rotate(2 1030 204)">
    <path d="M838 50L1224 54L1220 351L843 347Z" fill="#D8D7CC" opacity=".5"/>
    <path d="M833 45L1219 49L1215 346L838 342Z" fill="#FFFDF5" stroke="#B5B8AB"/>
    <path d="M976 33L1085 39L1080 64L972 59Z" fill="#E4CBA0" opacity=".8"/>
    <g font-family="'Segoe Print', 'Comic Sans MS', cursive" fill="#2F5070">
      <text x="866" y="95" font-size="20">a very honest workflow</text>
      <text x="891" y="158" font-size="26">idea</text>
      <text x="1081" y="158" font-size="26">build</text>
      <text x="1092" y="245" font-size="26">test</text>
      <text x="889" y="245" font-size="26">hmm.</text>
      <text x="860" y="310" font-size="17">repeat until it makes sense.</text>
    </g>
    <g fill="none" stroke="#2F5070" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M963 147Q1017 137 1061 146"/>
      <path d="M1137 171Q1154 192 1139 215"/>
      <path d="M1068 235Q1010 247 968 235"/>
      <path d="M883 214Q859 193 883 174"/>
    </g>
    <path d="M898 258Q924 254 953 258" stroke="#BE6549" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
