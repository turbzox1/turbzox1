<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title description">
  <title id="title">Piyush Patni</title>
  <desc id="description">Data with depth. Software with purpose. A navy, mint and violet illustration joining analytical signals with software systems.</desc>
