  <g class="mono" font-size="13"><rect x="940" y="315" width="440" height="62" rx="10" fill="#0e151c" stroke="#34414b"/><text x="962" y="352" fill="#b7e866">~</text><text x="979" y="352" fill="#83929e"> ship ideas that survive contact with reality</text><rect x="1342" y="338" width="8" height="17" rx="1" fill="#b7e866" class="cursor"/></g>
</svg>
