<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">Piyush Patni — software, data, and applied machine learning</title>
  <desc id="desc">An animated dark systems dashboard showing Piyush Patni's work across software, data, and applied machine learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11171e"/><stop offset=".58" stop-color="#0b1016"/><stop offset="1" stop-color="#080c11"/></linearGradient>
    <linearGradient id="trace" x1="0" x2="1"><stop stop-color="#b7e866" stop-opacity="0"/><stop offset=".45" stop-color="#d5ff85"/><stop offset="1" stop-color="#b7e866" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#b7e866" stop-opacity=".16"/><stop offset="1" stop-color="#b7e866" stop-opacity="0"/></radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="chartClip"><rect x="975" y="84" width="375" height="179" rx="8"/></clipPath>
    <style>
      .sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.muted{fill:#7f8d99}.grid{stroke:#26313a;stroke-width:1}.node{fill:#b7e866}.pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse-b{animation-delay:.9s}.pulse-c{animation-delay:1.8s}.flow{stroke-dasharray:8 14;animation:flow 3s linear infinite}.draw{stroke-dasharray:650;stroke-dashoffset:650;animation:draw 3.8s ease-in-out infinite}.cursor{animation:blink 1s steps(1) infinite}.scan{animation:scan 5s linear infinite}
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(.72)}45%{opacity:1;transform:scale(1)}}@keyframes flow{to{stroke-dashoffset:-44}}@keyframes draw{0%{stroke-dashoffset:650}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-650}}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}@keyframes scan{from{transform:translateX(-430px)}to{transform:translateX(430px)}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.draw,.cursor,.scan{animation:none}.draw{stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="1440" height="420" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="1438" height="418" rx="17" fill="none" stroke="#2c3741"/><circle cx="1094" cy="187" r="300" fill="url(#glow)"/>
