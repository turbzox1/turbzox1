  <g class="sans"><circle cx="64" cy="55" r="4" class="node pulse"/><text x="82" y="61" font-size="14" font-weight="650" letter-spacing="3.5" fill="#aab6bf">PIYUSH PATNI / ENGINEER</text><text x="58" y="173" font-size="74" font-weight="760" letter-spacing="-3.6" fill="#f1f5f7">I build useful</text><text x="58" y="252" font-size="74" font-weight="760" letter-spacing="-3.6" fill="#f1f5f7">things from</text><text x="58" y="331" font-size="74" font-weight="760" letter-spacing="-3.6" fill="#b7e866">messy problems.</text><text x="62" y="382" font-size="14" font-weight="650" letter-spacing="2.1" fill="#96a4ae">SOFTWARE</text><circle cx="171" cy="377" r="3" fill="#48545e"/><text x="190" y="382" font-size="14" font-weight="650" letter-spacing="2.1" fill="#96a4ae">DATA</text><circle cx="255" cy="377" r="3" fill="#48545e"/><text x="274" y="382" font-size="14" font-weight="650" letter-spacing="2.1" fill="#96a4ae">APPLIED ML</text></g>
  <g><path d="M866 55H1326Q1354 55 1354 83V279" fill="none" stroke="#384550"/><path d="M866 55H1326Q1354 55 1354 83V279" fill="none" stroke="#b7e866" stroke-width="1.5" class="flow" opacity=".7"/><circle cx="866" cy="55" r="5" class="node pulse pulse-b"/><circle cx="1354" cy="279" r="5" class="node pulse pulse-c"/></g>
